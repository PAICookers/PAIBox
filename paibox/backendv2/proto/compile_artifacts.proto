syntax = "proto3";

package backendv2;

message CoreOffset {
    optional int32 xy = 1;
    optional int32 x = 2;
    optional int32 y = 3;
}

message CopyCount {
    optional int32 xy = 1;
    optional int32 x = 2;
    optional int32 y = 3;
}

message TickParams {
    optional uint32 tick_start = 1;
    /* 0 means always active; N > 0 means active for N sync_all ticks. */
    optional uint32 tick_duration = 2;
    /* 0 means no automatic reset. */
    optional uint32 tick_initial = 3;
}

/* DATA payload code type. VOLTAGE outputs leave dtype unset and are int32. */
message DataType {
    enum Code {
        NOT_SET = 0;
        UINT1 = 1;
        INT1 = 2;
        UINT2 = 3;
        INT2 = 4;
        UINT4 = 5;
        INT4 = 6;
        UINT8 = 7;
        INT8 = 8;
        FLOAT16 = 9;
    }
}

message InputEntry {
    /* Logical element index within the exported input tensor. */
    optional uint32 elem_idx = 1;
    CoreOffset core_offset = 2;
    CopyCount copy_count = 3;
    optional uint32 tick_relative = 4;
    optional uint32 addr_axon = 5;
    optional uint32 target_lcn = 6;
    /* Logical copy id introduced by tiling/folding; unrelated to Copy_XY / Copy_X / Copy_Y. */
    optional uint32 copy_id = 7;
    /* Data type interpreted by the first real consumer compute core. */
    optional DataType.Code dtype = 9;
}

message OutputEntry {
    optional uint32 elem_idx = 1;
    optional uint32 copy_id = 2;
    /* DATA: output axon bit index. VOLTAGE: membrane voltage base index. */
    optional uint32 axon_bit_idx = 4;
    /* DATA output type. VOLTAGE outputs are always int32 and leave this unset. */
    optional DataType.Code dtype = 5;
}

message Shape {
    repeated int32 size = 1;
}

message InputTensorMapping {
    string name = 1;
    Shape shape = 2;
    /* Payload bit width shared by every entry in this input tensor. */
    optional uint32 bit_width = 3;
    /* Compute-core tick parameters for this graph input tensor. */
    TickParams tick = 4;
    repeated InputEntry entries = 5;
}

message OutputTensorMapping {
    enum OutputKind {
        DATA = 0;
        VOLTAGE = 1;
    }

    string name = 1;
    Shape shape = 2;
    optional OutputKind kind = 3;
    /* Payload bit width shared by every entry in this output tensor. */
    optional uint32 bit_width = 4;
    /* Compute-core tick parameters for this graph output tensor. */
    TickParams tick = 5;
    repeated OutputEntry entries = 6;
}

message InputTensorMappings {
    repeated InputTensorMapping items = 1;
}

message OutputTensorMappings {
    optional uint32 target_lcn = 1;
    repeated OutputTensorMapping items = 2;
}


message RuntimeParams {
    enum DecodeMode {
        STREAM = 0;
        STEP = 1;
    }

    optional uint32 timesteps = 1;
    optional uint32 tick_depth = 2;
    optional uint32 sync_steps = 3;
    optional DecodeMode decode_mode = 4;
}

message CoreTick {
    CoreOffset core_offset = 1;
    TickParams tick = 2;
    /* PAIIR nodes deployed on this physical compute core. */
    repeated string nodes = 3;
}

message ThreadIOMapping {
    optional uint32 thread_id = 1;
    /* Relative offset of the group-thread global-signal root core. */
    CoreOffset root_core_offset = 2;
    RuntimeParams runtime = 3;
    InputTensorMappings input_mappings = 4;
    OutputTensorMappings output_mappings = 5;
    repeated CoreTick core_ticks = 6;
}

message IOMapping {
    repeated ThreadIOMapping threads = 1;
}

message ConfigFrames {
    enum WordOrder {
        HIGH_FIRST = 0;
        LOW_FIRST = 1;
    }

    /* Flattened 32-bit words split from exported 64-bit config frames. */
    repeated uint32 words = 1;
    /* Order of the 32-bit words within each logical 64-bit config frame. */
    WordOrder word_order = 2;
}

message CompileArtifacts {
    uint32 schema_version = 1;
    IOMapping io_mapping = 2;
    ConfigFrames config_frames = 3;
}
