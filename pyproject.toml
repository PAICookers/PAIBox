[project]
name = "paibox"
version = "1.3.0"
description = "Toolchain of PAICORE"
authors = [{ name = "Ziru Pan", email = "zrpan@stu.pku.edu.cn" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0,<9",
    "flatbuffers==25.12.19",
    "numpy>=2.1.0,<3.0.0",
    "paicorelib>=2.0.0; platform_machine != 'armv7l'",
    "protobuf>=5.27.1,<7",
    "rich>=14.0.0",
]
maintainers = [
    { name = "Hongjian Wen", email = "221900303@smail.nju.edu.cn" },
    { name = "Siyuan Gao", email = "siyuan-gao@outlook.com" },
    { name = "Zhaoyang Hao", email = "hzyang2218@gmail.com" },
    { name = "Ziru Pan", email = "zrpan@stu.pku.edu.cn" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
keywords = ["PAICORE", "neuromorphic-chip", "toolchain", "brain-inspired-ai"]

[project.scripts]
paiviz = "paibox.visualizer.cli:main"

[project.optional-dependencies]
visualizer = ["fastapi>=0.128.0,<1", "uvicorn>=0.38.0,<1"]
snntorch = ["snntorch>=0.9.4,<2"]
spikingjelly = ["spikingjelly>=0.0.0.0.12,<1"]
nir = ["nir>=1.0.6,<2"]

[project.urls]
repository = "https://github.com/PAICookers/PAIBox"
homepage = "https://github.com/PAICookers/PAIBox"
documentation = "https://github.com/PAICookers/PAIBox#readme"

[tool.poetry]
packages = [{ include = "paibox" }]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-md>=0.2",
    "pytest-xdist>=3.7.0",
    "orjson>=3.11.6",
    "torch>=2.0.0,<2.2.0 ; python_full_version < '3.12'",
    "torch>=2.2.0 ; python_full_version >= '3.12'",
    "spikingjelly>=0.0.0.0.12,<1",
    "snntorch>=0.9.4,<2",
    "tabulate>=0.9.0",
    "ortools==9.14.6206 ; python_full_version < '3.14'",
    "ortools==9.15.6755 ; python_full_version >= '3.14'",
    "numba>=0.64.0",
]

[tool.uv]
package = true
python-preference = "system"
environments = ["platform_machine != 'armv7l'"]

[tool.uv.build-backend]
module-name = "paibox"
module-root = ""

[tool.poetry.group.dev.dependencies]
torch = [
    { version = ">=2.0.0,<2.2.0", python = "<3.12", source = "pytorch-cpu" },
    { version = ">=2.2.0", python = ">=3.12", source = "pytorch-cpu" },
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--cov=paibox", "--cov-branch"] #, "--cov-report=term", "-nauto"]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"
